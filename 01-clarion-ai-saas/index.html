<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23000'/><g fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'><path d='M16 6 26 11.5 16 17 6 11.5Z'/><path d='M6 16.5 16 22 26 16.5'/><path d='M6 21 16 26.5 26 21'/></g></svg>" />
  <title>Plety — The intelligence layer for clear decisions</title>
  <meta name="description" content="Plety integrates into your stack to deliver real-time understanding, not just predictions." />
  <meta name="theme-color" content="#000000" />
  <link rel="preload" href="assets/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/hero-poster.webp" as="image" />
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/inter-400.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url(assets/fonts/inter-500.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url(assets/fonts/inter-600.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url(assets/fonts/inter-700.woff2) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/instrument-serif-400.woff2) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(assets/fonts/instrument-serif-400-italic.woff2) format('woff2'); }
    /* 只含「清晰」「自动化」5 个字的宋体子集（中文强调词用） */
    @font-face { font-family: 'Noto Serif SC'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/noto-serif-sc-subset.woff2) format('woff2'); unicode-range: U+52A8, U+5316, U+6670, U+6E05, U+81EA; }

    html { scroll-behavior: smooth; color-scheme: dark; scroll-padding-top: 88px; }
    body { background: #000; touch-action: manipulation; }
    a, button { -webkit-tap-highlight-color: rgba(255, 255, 255, 0.08); }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-fade {
      -webkit-mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
              mask-image: linear-gradient(to right, transparent, #000 18%, #000 82%, transparent);
    }
    @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    /* 中文：取消负字距（汉字挤在一起会发黑），正文行高略放宽 */
    html[lang="zh-CN"] .tracking-tight { letter-spacing: 0; }
    html[lang="zh-CN"] .leading-relaxed { line-height: 1.8; }
    /* 中文标题只在标点或指定断点处换行，放不下时才强制断开 */
    html[lang="zh-CN"] :is(h1, h2) { word-break: keep-all; overflow-wrap: anywhere; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .motion-safe-marquee { animation: none !important; }
      .eq-bar { animation: none !important; }
    }
    ::selection { background: rgba(255, 255, 255, 0.2); }
  </style>
  <link rel="stylesheet" href="assets/tw.css" />
  <script src="assets/app.js" defer></script>
</head>
<body class="bg-black text-white font-sans antialiased">
  <!--
    Plety — AI SaaS landing page (case study)
    Hero design & background videos: SceneAI (sceneai.art)
    Source: src/app.jsx · build: esbuild + Tailwind CLI
  -->
  <div id="root"></div>
  <noscript><p style="padding:2rem;color:#fff;font-family:system-ui">This page needs JavaScript. / 本页面需要启用 JavaScript。</p></noscript>
</body>
</html>
